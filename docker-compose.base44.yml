services:
  web:
    image: node:20.16-bookworm-slim
    working_dir: /app
    volumes:
      - ./enatega-multivendor-web:/app
      # keep installed deps and build cache out of the host bind mount
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - HUSKY=0
      - WATCHPACK_POLLING=true
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-http://localhost:4000}
      - NEXT_PUBLIC_WS_SERVER_URL=${NEXT_PUBLIC_WS_SERVER_URL:-ws://localhost:4000}
    command: sh -c "npm install && npx next dev --webpack -H 0.0.0.0 -p 3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 150s
    restart: on-failure
